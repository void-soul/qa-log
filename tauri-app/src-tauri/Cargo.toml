[package]
name = "qa-log-browser"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"

[package.metadata]
# Tauri v2 配置通过 tauri.conf.json 提供，此处保留 bundle 元数据以满足 tauri-build
[package.metadata.bundle]
identifier = "com.qalog.browser"
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.ico"
]

[dependencies]
# Tauri v2.11 需要 tauri-build >= 2.11，但 crates.io 最新只到 2.6.3
# 当前 Cargo.lock 已锁定 tauri 2.11.5 + tauri-build 2.6.3，可正常编译
tauri = { version = "2.6", features = [] }
# 不引入 tauri-plugin-shell：前端零引用，未使用的授权只是攻击面
# （capabilities 里的 shell:allow-open 已同步移除）
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

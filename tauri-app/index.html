<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Log</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --fg: #e6edf3;
      --fg-muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .controls { display: flex; gap: 10px; align-items: center; }
    input[type="text"] { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 13px; width: 220px; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }
    select, button { background: var(--surface); color: var(--fg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    select:hover, button:hover { border-color: var(--accent); }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
    .entry-list { flex: 1; overflow-y: auto; }
    .entry-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .entry-item:hover { background: rgba(88,166,255,0.08); }
    .entry-item.active { background: rgba(88,166,255,0.15); border-left: 3px solid var(--accent); }
    .qid { font-weight: 600; font-size: 13px; color: var(--accent); }
    .qtitle { font-size: 12px; color: var(--fg-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qmeta { font-size: 11px; color: var(--fg-muted); margin-top: 4px; display: flex; gap: 8px; }
    .badge { padding: 1px 6px; border-radius: 10px; font-size: 10px; }
    .badge-pending { background: rgba(139,148,158,0.2); color: var(--fg-muted); }
    .badge-resolved { background: rgba(63,185,80,0.2); color: var(--success); }
    .badge-unresolved { background: rgba(248,81,73,0.2); color: var(--danger); }
    .badge-wontfix { background: rgba(210,153,34,0.2); color: var(--warning); }
    .detail { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--fg-muted); }
    .card { max-width: 720px; margin: 0 auto; }
    .card-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .card-header .qid { font-size: 22px; font-weight: 700; color: var(--accent); }
    .card-header .meta { font-size: 13px; color: var(--fg-muted); margin-top: 4px; display: flex; gap: 12px; }
    .section { margin-bottom: 20px; }
    .section h3 { font-size: 11px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .section p { color: var(--fg); white-space: pre-wrap; line-height: 1.6; }
    table.files-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.files-table th, table.files-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    table.files-table th { background: var(--surface); color: var(--accent); font-weight: 600; }
    table.files-table tr:hover td { background: rgba(88,166,255,0.05); }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
    .btn:hover { border-color: var(--accent); }
    .btn-edit:hover { border-color: var(--accent); }
    .btn-delete { color: var(--danger); border-color: var(--border); }
    .btn-delete:hover { border-color: var(--danger); background: rgba(248,81,73,0.1); }
    .btn-primary { background: var(--accent); color: #0d1117; border: none; font-weight: 600; }
    .btn-primary:hover { filter: brightness(1.1); }
    /* 弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 640px; max-width: 92vw; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .modal-head { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { background: none; border: none; color: var(--fg-muted); font-size: 20px; cursor: pointer; line-height: 1; }
    .modal-close:hover { color: var(--fg); }
    .modal-body { padding: 16px 20px; overflow-y: auto; }
    .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
    .form-row { margin-bottom: 12px; }
    .form-row label { display: block; font-size: 12px; color: var(--fg-muted); margin-bottom: 4px; }
    .form-row input[type="text"], .form-row select, .form-row textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 13px; outline: none; font-family: inherit; }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-row textarea.files { min-height: 120px; font-family: Consolas, monospace; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ---------- Markdown 渲染 (.md 容器内) ---------- */
    .md { color: var(--fg); line-height: 1.65; font-size: 14px; word-wrap: break-word; }
    .md > *:first-child { margin-top: 0; }
    .md > *:last-child { margin-bottom: 0; }
    .md p { margin: 8px 0; }
    .md h1,.md h2,.md h3,.md h4,.md h5,.md h6 { margin: 16px 0 8px; font-weight: 600; color: var(--fg); line-height: 1.3; }
    .md h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md h2 { font-size: 18px; }
    .md h3 { font-size: 16px; color: var(--accent); }
    .md h4 { font-size: 15px; }
    .md ul,.md ol { margin: 8px 0; padding-left: 22px; }
    .md li { margin: 3px 0; }
    .md li > p { margin: 3px 0; }
    .md code { background: rgba(110,118,129,0.18); padding: 1px 6px; border-radius: 4px; font-family: Consolas,"Cascadia Code",monospace; font-size: 13px; color: #ff7b72; }
    .md pre { background: var(--bg); border: 1px solid var(--border); padding: 12px 14px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
    .md pre code { background: transparent; padding: 0; color: var(--fg); font-size: 13px; }
    .md blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; margin: 10px 0; color: var(--fg-muted); background: rgba(88,166,255,0.05); border-radius: 0 4px 4px 0; }
    .md blockquote > :first-child { margin-top: 0; }
    .md blockquote > :last-child { margin-bottom: 0; }
    .md table { border-collapse: collapse; font-size: 13px; margin: 10px 0; width: 100%; max-width: 100%; }
    .md table th,.md table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
    .md table th { background: var(--surface); color: var(--accent); font-weight: 600; }
    .md table tr:nth-child(even) td { background: rgba(110,118,129,0.05); }
    .md table tr:hover td { background: rgba(88,166,255,0.08); }
    .md a { color: var(--accent); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md strong { color: var(--fg); font-weight: 700; }
    .md em { color: var(--fg); font-style: italic; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .md-placeholder { color: var(--fg-muted); font-style: italic; margin: 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>QA Log</h1>
      <div class="controls">
        <div class="search-wrap"><input type="text" id="search" placeholder="搜索..." oninput="filter()"></div>
        <select id="statusFilter" onchange="filter()"><option value="">全部状态</option><option value="Pending">待解决</option><option value="已解决待验证">已解决待验证</option><option value="已验证">已验证</option><option value="WontFix">暂不修复</option><option value="Unresolved">未解决</option></select>
        <button onclick="refresh()">刷新</button>
      </div>
    </div>
    <div class="main">
      <div class="sidebar">
        <div class="sidebar-head"><span>QA 条目</span><span id="stats">共 0 条</span></div>
        <div class="entry-list" id="entryList"></div>
      </div>
      <div class="detail" id="detail"><div class="detail-empty">选择左侧条目查看详情</div></div>
    </div>
  </div>

  <!-- Markdown 渲染器 (本地 vendored，避免外网/网络失败) -->
  <script src="vendor/marked.min.js"></script>

  <!-- 编辑弹窗 -->
  <div class="modal-mask" id="editModal" style="display:none">
    <div class="modal">
      <div class="modal-head">
        <span>编辑 QA 记录</span>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-row">
            <label>QID</label>
            <input type="text" id="editQid">
          </div>
          <div class="form-row">
            <label>日期</label>
            <input type="text" id="editDate" disabled>
          </div>
          <div class="form-row">
            <label>类别</label>
            <select id="editCategory">
              <option>Bug Fix</option><option>Feature</option><option>Architecture</option>
              <option>Refactoring</option><option>Performance</option><option>Config/Setup</option>
              <option>Understanding</option><option>Other</option>
            </select>
          </div>
          <div class="form-row">
            <label>状态</label>
            <select id="editStatus">
              <option value="Pending">Pending</option>
              <option value="已解决待验证">已解决待验证</option>
              <option value="已验证">已验证</option>
              <option value="WontFix">WontFix</option>
              <option value="Unresolved">Unresolved</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label>现象/需求</label>
          <textarea id="editPhenomenon" rows="2"></textarea>
        </div>
        <div class="form-row">
          <label>根因</label>
          <textarea id="editRootCause" rows="3"></textarea>
        </div>
        <div class="form-row">
          <label>解决方案</label>
          <textarea id="editSolution" rows="4"></textarea>
        </div>
        <div class="form-row">
          <label>涉及文件（Markdown 表格，每行一条）</label>
          <textarea id="editFiles" class="files" rows="4" placeholder="| File | Change |&#10;|------|--------|&#10;| app.py | 修改 Width |"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeEditModal()">取消</button>
        <button class="btn btn-primary" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <script src="src/index.js"></script>
</body>
</html>
